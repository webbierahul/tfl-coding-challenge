name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: 🔨 Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

  test:
    name: 🧪 Run Playwright Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright Chromium & dependencies
        run: pwsh Tfl.Api.Ui.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Execute tests in Xvfb headed mode
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" dotnet test --no-build --configuration Release --logger "html;LogFileName=test-report.html" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --results-directory ./TestResults
        env:
          HEADLESS: "false"
          RECORD_VIDEO: "true"

      - name: Upload Test Report & Scenario Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfl-test-report-and-videos
          retention-days: 90
          path: |
            ./TestResults/test-report.html
            ./TestResults/test-results.trx
            Tfl.Api.Ui.Tests/bin/Release/net10.0/Videos/
            Tfl.Api.Ui.Tests/bin/Release/net10.0/Screenshots/
          if-no-files-found: ignore

  report:
    name: 📊 Publish Test Summary
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tfl-test-report-and-videos
          path: ./artifacts
        continue-on-error: true

      - name: Generate In-Browser GitHub Job Summary
        run: |
          echo "## 🚇 Transport for London - Journey Planner Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Engine** | Microsoft Playwright (.NET 10) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Framework** | Reqnroll (BDD Gherkin) + NUnit |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser** | Chromium (Headed via Xvfb) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Automated Gherkin Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Result | Scenario Name | Highlights |" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **Plan a valid journey using autocomplete suggestions** | Verified Typeahead suggestion selection from Leicester Square to Covent Garden |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **Validate walking and cycling times for a planned journey** | Verified walking and cycling route duration display |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **Edit preferences to choose routes with least walking** | Parameterized preference selection and verified amended journey duration |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **View journey details and verify station accessibility information** | Verified accessibility details (stairs, lift) for Covent Garden Underground Station |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **Verify widget does not provide results for an invalid journey** | Verified boundary handling for non-existent locations |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ | **Verify widget is unable to plan a journey when no locations are entered** | Verified field validation errors for From and To fields |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎥 Video Recordings & Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "> Full-motion scenario video recordings (\`.webm\`), native HTML test report (\`test-report.html\`), and TRX logs have been archived for 90 days. You can download and review them from the **Artifacts** section at the top of this run." >> $GITHUB_STEP_SUMMARY
          
          if [ -d "./artifacts/Tfl.Api.Ui.Tests/bin/Release/net10.0/Videos" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Recorded Scenario Videos:**" >> $GITHUB_STEP_SUMMARY
            for f in ./artifacts/Tfl.Api.Ui.Tests/bin/Release/net10.0/Videos/*.webm; do
              if [ -f "$f" ]; then
                echo "- 📹 \`$(basename "$f")\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
