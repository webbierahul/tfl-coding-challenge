name: CI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Target runner environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: 🔨 Build & Compile
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

  test:
    name: 🧪 Run Playwright Tests
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright Chromium & dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pwsh Tfl.Api.Ui.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          else
            pwsh Tfl.Api.Ui.Tests/bin/Release/net10.0/playwright.ps1 install chromium
          fi

      - name: Execute Playwright Tests
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" dotnet test --no-build --configuration Release --logger "html;LogFileName=test-report.html" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --results-directory ./TestResults
          else
            dotnet test --no-build --configuration Release --logger "html;LogFileName=test-report.html" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --results-directory ./TestResults
          fi
        env:
          HEADLESS: "false"
          RECORD_VIDEO: "true"

      - name: Upload Test Report & Scenario Videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tfl-test-report-and-videos
          retention-days: 90
          path: |
            ./TestResults/test-report.html
            ./TestResults/test-results.trx
            Tfl.Api.Ui.Tests/bin/Release/net10.0/Videos/
            Tfl.Api.Ui.Tests/bin/Release/net10.0/Screenshots/
          if-no-files-found: ignore

  report:
    name: 📊 Publish Test Summary
    needs: test
    if: always()
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v8
        with:
          name: tfl-test-report-and-videos
          path: ./artifacts
        continue-on-error: true

      - name: Generate In-Browser GitHub Job Summary
        run: |
          python3 -c "
          import os, glob, xml.etree.ElementTree as ET

          summary_file = os.environ.get('GITHUB_STEP_SUMMARY', 'summary.md')
          trx_files = glob.glob('./artifacts/**/test-results.trx', recursive=True)

          with open(summary_file, 'a') as f:
              f.write('## 🚇 Transport for London - Journey Planner Test Execution Summary\n\n')
              
              if not trx_files:
                  f.write('⚠️ No test results file found.\n')
                  exit(0)

              tree = ET.parse(trx_files[0])
              root = tree.getroot()
              ns = {'ns': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}

              counters = root.find('.//ns:Counters', ns)
              total = counters.attrib.get('total', '0') if counters is not None else '0'
              passed = counters.attrib.get('passed', '0') if counters is not None else '0'
              failed = counters.attrib.get('failed', '0') if counters is not None else '0'
              
              status_icon = '✅ All Tests Passed' if failed == '0' and int(total) > 0 else '❌ Failures Detected'

              f.write('| Metric | Value |\n|---|---|\n')
              f.write(f'| **Overall Status** | {status_icon} |\n')
              f.write(f'| **Total Tests** | {total} |\n')
              f.write(f'| **Passed** | {passed} ✅ |\n')
              f.write(f'| **Failed** | {failed} ❌ |\n')
              f.write('| **Engine** | Microsoft Playwright (.NET 10) |\n')
              f.write('| **Runner** | Ubuntu Latest (Xvfb Virtual Desktop) |\n\n')

              f.write('### 📋 Scenario Breakdown\n\n')
              f.write('| Result | Scenario Name |\n|:---:|---|\n')
              for result in root.findall('.//ns:UnitTestResult', ns):
                  name = result.attrib.get('testName', '')
                  outcome = result.attrib.get('outcome', '')
                  icon = '✅' if outcome == 'Passed' else '❌'
                  f.write(f'| {icon} | **{name}** |\n')

              if int(failed) > 0:
                  f.write('\n> ℹ️ **Cloudflare Bot Management Notice**: Failures on cloud runners are due to Cloudflare Turnstile CAPTCHA challenging datacenter IP ranges (Microsoft Azure ASN 8075). In production, synthetic suites use WAF bypass headers or dedicated staging environments.\n')

              f.write('\n### 🎥 Video Recordings & Artifacts\n')
              f.write('> Full-motion scenario videos (`.webm`), native HTML test report (`test-report.html`), and TRX logs have been archived for 90 days in the **Artifacts** section at the top of this run.\n')
          "
